name: Smoke Tests

on:
  pull_request:
    paths:
      - "flutter_setup/**"
      - "tests/**"
      - "pyproject.toml"
      - "docker-compose.smoke-*.yaml"
      - "Dockerfile"
      - ".github/workflows/smoke.yaml"
  push:
    branches: ["main"]
    paths:
      - "flutter_setup/**"
      - "tests/**"
      - "pyproject.toml"
      - "docker-compose.smoke-*.yaml"
      - "Dockerfile"
      - ".github/workflows/smoke.yaml"
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: markcallen/flutter-setup-sdk-base

jobs:
  build-base:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SDK Base Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tests/Dockerfile.sdk-base
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  smoke-test-fast:
    runs-on: ubuntu-latest
    needs: build-base
    if: always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Fast Smoke Test
        run: |
          # On PRs, we pull the image and run without --build to use the GHCR 'warm' SDK
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker compose -f docker-compose.smoke-fast.yaml up smoke-test-fast --exit-code-from smoke-test-fast
          else
            docker compose -f docker-compose.smoke-fast.yaml up smoke-test-fast --build --exit-code-from smoke-test-fast
          fi

  smoke-test-full:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Full E2E Smoke Test
        run: |
          docker compose -f docker-compose.smoke-full.yaml up smoke-test-full --build --exit-code-from smoke-test-full
