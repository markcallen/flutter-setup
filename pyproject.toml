[project]
name = "flutter-setup"
version = "2.1.1"
description = "Flutter development environment setup CLI tool for macOS and Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Mark C Allen", email = "mark@markcallen.com" }
]
dependencies = [
    "click>=8.3.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "requests>=2.33.1",
]

[project.scripts]
flutter-setup = "flutter_setup.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "mypy>=1.20.1",
    "pre-commit>=4.0.0",
    "ruff>=0.15.10",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.setuptools.packages.find]
include = ["flutter_setup*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "space"

[tool.mypy]
strict = true
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=flutter_setup",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
]

[tool.coverage.run]
source = ["flutter_setup"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2
